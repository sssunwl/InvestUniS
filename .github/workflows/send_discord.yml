name: Send Daily Discord Digest (手動觸發)

# ⛔ 定時播報已於 2026-08-08 正式作廢，不要再加回來。
#
# 沿革：
#   2026-07-10  暫停 —— SS 決定先深入研究穩健套利策略
#   2026-08-08  作廢 —— 原定的 4 個時段跟實際股市開收盤對不上，
#               推送時機沒有意義。不是「暫時停用」，是這套時段設計本身不成立。
#
# 之後若真要恢復定時播報，前提是先重新對齊各市場的實際交易時段
# （含夏令/冬令時差、港台日美各自的休市日），不要直接把下面這組舊 cron 復活。
#
#   （作廢的舊時段，僅留作紀錄）
#   0 0 * * 2-6    08:00 HKT  美股夜盤後總結 + 加密市場
#   0 1 * * 1-5    09:00 HKT  亞洲盤前合集
#   0 9 * * 1-5    17:00 HKT  亞洲盤後合集
#   30 13 * * 1-5  21:30 HKT  美股盤前預覽 + 加密市場
#
# 保留 workflow_dispatch：要單獨產一份 digest 時仍可手動跑。

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest news
        run: python scripts/fetch_news.py

      - name: Determine message type from triggering schedule
        id: msgtype
        run: |
          case "${{ github.event.schedule }}" in
            '0 0 * * 2-6')   echo "type=us_post" >> "$GITHUB_OUTPUT" ;;
            '0 1 * * 1-5')   echo "type=asia_pre" >> "$GITHUB_OUTPUT" ;;
            '0 9 * * 1-5')   echo "type=asia_post" >> "$GITHUB_OUTPUT" ;;
            '30 13 * * 1-5') echo "type=us_pre" >> "$GITHUB_OUTPUT" ;;
            *)               echo "type=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Commit updated news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "InvestUni Bot"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add data/news.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: news update [$(TZ=Asia/Hong_Kong date '+%H:%M HKT')]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Send Discord digest
        env:
          MSG_TYPE: ${{ steps.msgtype.outputs.type }}
          DISCORD_WEBHOOK_INVESTUNIS: ${{ secrets.DISCORD_WEBHOOK_INVESTUNIS }}
        run: python scripts/daily_tip.py
